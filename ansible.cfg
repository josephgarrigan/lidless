[defaults]
inventory = inventory.ini
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
# `yaml` as the default stdout callback fails on ansible-core 2.21 with
# "Could not load 'yaml' callback plugin" — the plugin is not in the builtin
# collection there. The default callback needs no plugin and works everywhere.
stdout_callback = default
bin_ansible_callbacks = True
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
